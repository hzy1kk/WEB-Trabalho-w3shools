<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sidenav Abrir/Fechar</title>

    <!-- CSS externo -->
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <div id="mySidenav" class="sidenav" aria-label="Menu lateral">
      <a href="javascript:void(0)" class="closebtn" onclick="closeNav()" aria-label="Fechar menu">&times;</a>
      <a href="#">About</a>
      <a href="#">Services</a>
      <a href="#">Clients</a>
      <a href="#">Contact</a>
    </div>

    <!-- Botão/trigger para abrir -->
    <span class="open-trigger" onclick="openNav()" role="button" tabindex="0">
      open
    </span>

    <div id="main">
      <h1>Conteúdo principal</h1>
      <p>
        Clique em <strong>open</strong> para abrir o menu e no <strong>&times;</strong> para fechar.
      </p>
      <p>
        Esse texto existe só para você visualizar o deslocamento do conteúdo.
      </p>
    </div>

    <!-- JS externo -->
    <script src="./script.js"></script>
  </body>
</html>
